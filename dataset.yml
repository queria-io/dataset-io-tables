# この dataset.yml は fdl commit が読む（FDL の dataset.json を YAML で書いたもの）。
# 表の説明は models/ の *.table.yml に書く。表と列の型・NULL・行数は fdl commit がカタログから埋める。
# Queria だけの項目（テーマ・カバー・列の意味）は annotations.queria に書く。
name: io_tables
title: 産業連関表
description: |-
  日本の産業連関表（1995・2000・2005・2011・2015・2020 年）、接続産業連関表（1985 年〜2020 年）、延長産業連関表（1973 年〜2022 年の毎年）の取引基本表を、1 行が 1 セルの縦長のテーブルにしたデータセットです。投入係数・逆行列係数・部門ごとの生産誘発係数と粗付加価値誘発係数も計算して収録しています。

  OECD の国際産業連関表（ICIO、81 の国・地域 × 50 産業、1995 年〜2022 年）の取引額と、国×産業ごとの誘発係数も収録しています。

  出典：総務省ほか「産業連関表」「接続産業連関表」、経済産業省「延長産業連関表」、OECD (2025), Inter-Country Input-Output Database, http://oe.cd/icio。Queria が加工したものです。
keywords:
  - 産業連関表
  - 産業連関分析
  - 経済波及効果
  - 取引基本表
  - 投入係数
  - 逆行列係数
  - 生産誘発
  - 接続産業連関表
  - 延長産業連関表
  - input-output table
  - ICIO
  - 国際産業連関表
  - グローバルバリューチェーン
homepage: https://github.com/queria-io/dataset-io-tables
language: ja

