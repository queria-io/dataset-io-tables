name: "io_tables"
version: "1.0.0"

profile: "io_tables"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros", "shared/macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  io_tables:
    +database: io_tables
    japan:
      raw:
        +materialized: table
      stg:
        +materialized: view
      mart:
        +materialized: table
    oecd:
      raw:
        +materialized: table
        # 取引額は 2.9 億行あるので、raw と stg はテーブルにせず mart の中で展開する
        raw_oecd_transactions:
          +materialized: ephemeral
      stg:
        +materialized: view
        stg_oecd_transactions:
          +materialized: ephemeral
      mart:
        +materialized: table
