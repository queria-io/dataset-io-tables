name: Apply

on:
  push:
    branches: [main]
  # 産業連関表は5年ごとに出る。定期実行はせず、新しい表を足すときに手で回す
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    # Queria への書き込みは GitHub Actions の OIDC で 1 時間のトークンを取って行う
    permissions:
      contents: read
      id-token: write
    uses: queria-io/dataset-shared/.github/workflows/sync.yml@c146191a4b8515eff9174cf9856e86365e46bc56
    with:
      dataset_name: io_tables
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
