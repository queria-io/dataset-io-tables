name: Apply

on:
  push:
    branches: [main]
  # 産業連関表は5年ごとに出る。定期実行はせず、新しい表を足すときに手で回す
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    # Queria への書き込みは GitHub Actions の OIDC で 1 時間のトークンを取って行う。
    # contents と pull-requests は、Queria で変更された説明をこのリポジトリに戻す PR に使う
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    uses: queria-io/dataset-shared/.github/workflows/sync.yml@252f25b5f027b83c61e265125e7557259135e8e7
    with:
      dataset_name: io_tables
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
