name: Build

# 公開せずにパイプラインと dbt build だけを回す。出典の Excel の形が変わったときに
# Sync より先に気づくため
on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: uv run python -c "import main; main.extract()"
      - run: uv run dbt build --profiles-dir ci
