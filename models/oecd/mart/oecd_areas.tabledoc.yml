$schema: https://tabledoc.queria.io/schemas/table/v1.json
title: ICIO の国・地域
description: |-
  OECD ICIO が対象にする 80 の国・地域と、それ以外をまとめた Rest of the World（ROW）です。名前は出典の英語のままです。
primary_key: [code]
columns:
  - name: code
    title: 国・地域コード
    description: ISO 3166-1 alpha-3（ROW は Rest of the World）
  - name: name
    title: 国・地域名
  - name: source_sha256
    title: 元のファイル
    description: 読んだ ReadMe（ReadMe_ICIO_small.xlsx）の sha256。source_file の sha256 を指す
