$schema: https://tabledoc.queria.io/schemas/table/v1.json
title: 元のファイル
description: |-
  oecd スキーマのテーブルを作った元のファイル（ICIO の zip と ReadMe）の一覧です。1 行が 1 つのファイルで、取得した URL・掲載ページ・取得日時と、ファイルの sha256 を持ちます。

  - tables・transactions・multipliers の source_sha256 は年の zip、areas・industries の source_sha256 は ReadMe の sha256 を指します
  - 1 回でアップロードできない大きさの zip は分割したファイル（.part00 など）として置いているので、分割ファイルごとの行と、つないだ zip の行（url は NULL）があります
  - ファイル本体は保存していません。url から取得できます
primary_key: [file]
sources: [inter-country-input-output-tables]
columns:
  - name: url
    title: ファイルの URL
    description: 分割ファイルをつないだ zip は NULL
  - name: page_url
    title: 掲載ページの URL
  - name: sha256
    title: ファイルの sha256
  - name: bytes
    title: バイト数
  - name: media_type
    title: メディアタイプ
  - name: retrieved_at
    title: 取得した日時
    description: UTC
  - name: etag
    title: ETag
    description: 取得したときの応答の ETag ヘッダー。無ければ NULL
  - name: last_modified
    title: Last-Modified
    description: 取得したときの応答の Last-Modified ヘッダー。無ければ NULL
  - name: file
    title: ファイル名
