schema: japan
name: sector_multipliers
title: 部門ごとの誘発係数
description: |-
  部門ごとの国内生産額・輸入係数・粗付加価値率と、逆行列係数（[I-(I-M)A]^-1 型）から計算した誘発係数です。1 行が 1 表の 1 部門です。
primary_key: [table_id, code]
fields:
  - name: table_id
    title: 表 ID
  - name: code
    title: 部門コード
  - name: name
    title: 部門名
  - name: output
    title: 国内生産額
    description: 百万円
    annotations: { queria: { semantic: { role: measure, agg: sum } } }
  - name: import_coefficient
    title: 輸入係数
    description: 輸入計 ÷ 国内需要（内生部門計 + 国内最終需要計）
  - name: value_added_ratio
    title: 粗付加価値率
    description: 粗付加価値部門計 ÷ 国内生産額
  - name: output_multiplier
    title: 生産誘発係数
    description: この部門の最終需要が 1 単位増えたときの全部門の生産の増加（逆行列係数の列和）
  - name: value_added_multiplier
    title: 粗付加価値誘発係数
    description: この部門の最終需要が 1 単位増えたときの全部門の粗付加価値の増加
